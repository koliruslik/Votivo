# Local environment of the Votivo backend. Every service is a git submodule under services/.
# One PostgreSQL instance holds a separate database and user per service (see postgres/init-databases.sh):
# a service reads and writes only its own database.
#
#   git submodule update --init --recursive    fetch the services first
#   cp .env.example .env                       optional: override ports and credentials
#   docker compose up -d --build --wait        start everything
#   docker compose down -v                     stop and drop the data
#
# Host ports are non-standard so they never clash with a locally installed PostgreSQL or RabbitMQ.
name: votivo

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
# ============================
# INFRASTRUCTURE
# ============================
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal
    logging: *default-logging

  # Local development server; data is persisted in PostgreSQL (keycloak_db).
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Database and credentials are created by postgres/init-databases.sh.
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      KEYCLOAK_VOTIVO_USER_ADMI_SECRET: ${KEYCLOAK_VOTIVO_USER_ADMI_SECRET:?Set KEYCLOAK_VOTIVO_USER_ADMI_SECRET in .env}
      KEYCLOAK_USER_SERVICE_SYNC_SECRET: ${KEYCLOAK_USER_SERVICE_SYNC_SECRET:?Set KEYCLOAK_USER_SERVICE_SYNC_SECRET in .env}
      KEYCLOAK_USER_SERVICE_MANAGEMENT_SECRET: ${KEYCLOAK_USER_SERVICE_MANAGEMENT_SECRET:?Set KEYCLOAK_USER_SERVICE_MANAGEMENT_SECRET in .env}
      KK_TO_RMQ_URL: rabbitmq
      KK_TO_RMQ_PORT: 5672
      KK_TO_RMQ_VHOST: ${RABBITMQ_VHOST:-/}
      KK_TO_RMQ_USERNAME: ${RABBITMQ_USER:-guest}
      KK_TO_RMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      KK_TO_RMQ_EXCHANGE: identity.users.exchange
    ports:
      - "${KEYCLOAK_PORT:-18080}:8080"
    volumes:
      - ./keycloak/import/${KEYCLOAK_REALM_VERSION:-v7}:/opt/keycloak/data/import:ro
      - ./keycloak/providers:/opt/keycloak/providers:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
    networks:
      - internal
    logging: *default-logging

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "${RABBITMQ_PORT:-15675}:5672"
      - "${RABBITMQ_MGMT_PORT:-25675}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - internal
    logging: *default-logging

  # Creates the exchanges, queues and bindings of docs/events.md (rabbitmq/definitions.json) before any service starts,
  # so an event published before its consumer has ever run waits in its queue instead of being dropped. The services
  # declare the same topology themselves; both must stay identical. Imported into the default vhost "/".
  # (RabbitMQ's load_definitions would switch off the default user and vhost that RABBITMQ_USER/PASSWORD create.)
  rabbitmq-topology:
    image: curlimages/curl:8.10.1
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./rabbitmq/definitions.json:/definitions.json:ro
    command:
      - -fsS
      - -u
      - ${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}
      - -H
      - "content-type: application/json"
      - -X
      - POST
      - --data-binary
      - "@/definitions.json"
      - http://rabbitmq:15672/api/definitions/%2F
    restart: "no"
    networks:
      - internal
    logging: *default-logging

# ============================
# VOTE SERVICE
# ============================
  migrate-vote:
    image: migrate/migrate:v4.19.0
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/vote-service/migrations:/migrations:ro
    command: ["-path", "/migrations", "-database", "postgres://vote:vote@postgres:5432/vote_db?sslmode=disable", "up"]
    networks:
      - internal

  vote-service:
    build: ./services/vote-service
    restart: unless-stopped
    depends_on:
      migrate-vote:
        condition: service_completed_successfully
      rabbitmq-topology:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      APP_HTTP_PORT: 8080
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:?Set INTERNAL_AUTH_SECRET in .env}
      DB_URL: postgres://vote:vote@postgres:5432/vote_db?sslmode=disable
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
    ports:
      - "127.0.0.1:${VOTE_SERVICE_PORT:-18083}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - internal
    logging: *default-logging

# ============================
# POLL SERVICE
# ============================
  # Publishes poll.started / poll.ended. The image has its own healthcheck (docker compose --wait uses it).
  # Tokens are issued for the browser at localhost and validated by Poll Service through the Keycloak container.
  poll-service:
    build: ./services/poll-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq-topology:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/poll_db
      DB_USERNAME: poll
      DB_PASSWORD: poll
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      KEYCLOAK_ISSUER_URI: ${POLL_KEYCLOAK_ISSUER_URI:-http://localhost:18080/realms/votivo}
      KEYCLOAK_JWK_SET_URI: ${POLL_KEYCLOAK_JWK_SET_URI:-http://keycloak:8080/realms/votivo/protocol/openid-connect/certs}
      KEYCLOAK_AUDIENCE: poll-service
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:?Set INTERNAL_AUTH_SECRET in .env}
    ports:
      # Loopback only, and every /api call needs the gateway's secret: the browser goes through `web`.
      - "127.0.0.1:${POLL_SERVICE_PORT:-18082}:8082"
    networks:
      - internal
    logging: *default-logging

# ============================
# RESULT SERVICE
# ============================
  # The JRE image has neither curl nor wget, so the healthcheck talks HTTP through bash.
  result-service:
    build: ./services/result-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq-topology:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/result_db
      DB_USERNAME: result
      DB_PASSWORD: result
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:?Set INTERNAL_AUTH_SECRET in .env}
    ports:
      - "127.0.0.1:${RESULT_SERVICE_PORT:-18084}:8083"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8083 && printf 'GET /actuator/health/readiness HTTP/1.0\r\n\r\n' >&3 && grep -q '"status":"UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - internal
    logging: *default-logging

# ============================
# WEB (FRONTEND)
# ============================
  # The Votivo web interface: http://localhost:4200. Sign-in and registration are Keycloak's pages (realm "votivo").
  # Its Node gateway verifies the token and forwards /api/v1 to Poll, Vote and Result. The browser must reach Keycloak
  # and this service under exactly the origins registered for the client (localhost:18080 and localhost:4200).
  web:
    build: ../frontend
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_started
      poll-service:
        condition: service_healthy
      vote-service:
        condition: service_healthy
      result-service:
        condition: service_healthy
    environment:
      PORT: 4200
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:4200}
      POLL_URL: http://poll-service:8082
      VOTE_URL: http://vote-service:8080
      RESULT_URL: http://result-service:8083
      KEYCLOAK_ISSUER: ${POLL_KEYCLOAK_ISSUER_URI:-http://localhost:18080/realms/votivo}
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/votivo/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: poll-service
      # The gateway verifies the access token and its DPoP proof; the services trust only calls that carry this secret.
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:?Set INTERNAL_AUTH_SECRET in .env}
      REQUIRE_DPOP: ${REQUIRE_DPOP:-true}
    ports:
      - "${WEB_PORT:-4200}:4200"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4200/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - internal
    logging: *default-logging

# ============================
# USER SERVICE
# ============================
  # No healthcheck: the service has no actuator yet and the JRE image has neither wget nor curl.
  user-service:
    build: ${USER_SERVICE_BUILD_CONTEXT:-./services/user-service}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/user_db
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: user
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      SPRING_RABBITMQ_VIRTUAL_HOST: ${RABBITMQ_VHOST:-/}
      APP_IDENTITY_BASE_URL: http://keycloak:8080
      APP_IDENTITY_REALM: votivo
      APP_IDENTITY_CLIENT_ID: user-service-sync
      APP_IDENTITY_CLIENT_SECRET: ${KEYCLOAK_USER_SERVICE_SYNC_SECRET:?Set KEYCLOAK_USER_SERVICE_SYNC_SECRET in .env}
      APP_IDENTITY_SYNC_ENABLED: "true"
      APP_IDENTITY_MANAGEMENT_CLIENT_ID: user-service-management
      APP_IDENTITY_MANAGEMENT_CLIENT_SECRET: ${KEYCLOAK_USER_SERVICE_MANAGEMENT_SECRET:?Set KEYCLOAK_USER_SERVICE_MANAGEMENT_SECRET in .env}
      APP_IDENTITY_MANAGEMENT_EMAIL_AS_USERNAME: "true"
      APP_SECURITY_ISSUER_URI: http://localhost:18080/realms/votivo
      APP_SECURITY_JWK_SET_URI: http://keycloak:8080/realms/votivo/protocol/openid-connect/certs
      APP_SECURITY_AUDIENCE: user-service
    ports:
      - "${USER_SERVICE_PORT:-18081}:8080"
    networks:
      - internal
    logging: *default-logging

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
